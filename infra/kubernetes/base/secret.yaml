# IMPORTANT: Do NOT store real secret values here.
# Use Sealed Secrets (https://github.com/bitnami-labs/sealed-secrets) or
# External Secrets Operator (https://external-secrets.io) to inject real values
# before applying this manifest to a cluster.
apiVersion: v1
kind: Secret
metadata:
  name: logiq-secrets
type: Opaque
stringData:
  JWT_SECRET: "change_me_min_32_chars_random_string"
  POSTGRES_PASSWORD: "change_me_min_32_chars"
  # Required by Alembic for schema migrations (synchronous driver)
  SYNC_DATABASE_URL: "postgresql://logiq:change_me@postgres:5432/logiq"
  DATABASE_URL: "postgresql+asyncpg://logiq:change_me@postgres:5432/logiq"
