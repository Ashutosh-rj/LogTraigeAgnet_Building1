apiVersion: v1
kind: Service
metadata:
  name: {{ include "logiq.fullname" . }}-backend
  labels:
    {{- include "logiq.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/name: {{ include "logiq.name" . }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
