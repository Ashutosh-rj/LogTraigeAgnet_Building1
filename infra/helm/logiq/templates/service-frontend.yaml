apiVersion: v1
kind: Service
metadata:
  name: {{ include "logiq.fullname" . }}-frontend
  labels:
    {{- include "logiq.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  selector:
    app.kubernetes.io/name: {{ include "logiq.name" . }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
