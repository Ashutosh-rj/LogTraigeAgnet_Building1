apiVersion: v1
kind: Secret
metadata:
  name: {{ include "logiq.fullname" . }}-secrets
  labels:
    {{- include "logiq.labels" . | nindent 4 }}
type: Opaque
# IMPORTANT: Do NOT store plaintext secrets here in production.
# Use Sealed Secrets (https://github.com/bitnami-labs/sealed-secrets) or
# External Secrets Operator (https://external-secrets.io) to inject real values.
stringData:
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  DATABASE_URL: {{ printf "postgresql+asyncpg://logiq:%s@postgres:5432/logiq" .Values.secrets.postgresPassword | quote }}
  SYNC_DATABASE_URL: {{ printf "postgresql://logiq:%s@postgres:5432/logiq" .Values.secrets.postgresPassword | quote }}
