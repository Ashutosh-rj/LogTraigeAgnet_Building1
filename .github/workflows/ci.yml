name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:

  # =========================================================
  # Backend
  # =========================================================

  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/backend

    env:
      KAFKA_ENABLED: "false"
      ENVIRONMENT: development
      BCRYPT_ROUNDS: "4"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install backend dependencies
        run: pip install -e ".[dev]"

      - name: Run Ruff
        run: ruff check .

      - name: Run tests
        run: pytest

  # =========================================================
  # Frontend
  # =========================================================

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  # =========================================================
  # Docker Compose Integration Test
  # =========================================================

  compose:
    runs-on: ubuntu-latest

    env:
      POSTGRES_PASSWORD: "testpassword12345678901234567890"
      JWT_SECRET: "testpassword12345678901234567890"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate compose config
        run: docker compose config --quiet

      - name: Boot stack
        run: |
          echo "POSTGRES_PASSWORD=testpassword12345678901234567890" >> .env
          echo "JWT_SECRET=testpassword12345678901234567890" >> .env
          docker compose up -d --wait --wait-timeout 120

      - name: Smoke test backend
        run: |
          curl -fsS http://localhost:8080/health/live

      - name: Smoke test frontend
        run: |
          curl -fsS http://localhost:3000

      - name: Tear down stack
        if: always()
        run: docker compose down -v

  # =========================================================
  # AI Evaluation Harness
  # =========================================================

  eval:
    runs-on: ubuntu-latest

    needs:
      - backend

    defaults:
      run:
        working-directory: apps/backend

    env:
      ENVIRONMENT: development
      EMBEDDING_PROVIDER: openai
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EVAL_F1_PASS_THRESHOLD: "0.80"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run evaluation harness
        run: |
          python -m tests.eval.score

      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            apps/backend/tests/eval/results/
            apps/backend/tests/eval/reports/
