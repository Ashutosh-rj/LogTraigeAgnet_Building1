# Copy .env.example to .env and fill in all secrets before running.
# Never commit .env to version control.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: logiq
      POSTGRES_USER: logiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logiq -d logiq"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    ports:
      - "9092:9092"

    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15

    volumes:
      - kafka-data:/tmp/kraft-combined-logs

  backend:
    build:
      context: ./apps/backend
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://logiq:${POSTGRES_PASSWORD}@postgres:5432/logiq
      SYNC_DATABASE_URL: postgresql+psycopg://logiq:${POSTGRES_PASSWORD}@postgres:5432/logiq
      JWT_SECRET: ${JWT_SECRET:?required}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
